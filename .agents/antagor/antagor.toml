schema = 1
worktree_root = "~/.antagor/worktrees"
mode = "fast"
prefix = "SEMKIT"
name = "semkit"
worker = "pi"
parallel = 3
stall_minutes = 25  # the gate runs up to 17 min under load; its pytest step is silent for minutes
checks = ["python3 scripts/check_command_docstrings.py"]
heavy = ["gate check", "pytest"]  # a worker's pytest runs 10 xdist workers (-n auto); three at once took the Mac down on 2026-10-26

[review]
worker = "pi-glm"  # another model than the author (the Human, 6.11)
required_types = ["feature", "bugfix"]  # chore and docs: the short path without review

[publish]
versioning = "semver"
changelog = "CHANGELOG.md"
deploy_command = "sh scripts/deploy.sh"
gate = "remote"  # the release gate runs on Gitea CI before the tag (in force after the Human's remote-gate-accept)
gate_status_url = "https://homeserver.tailee01ab.ts.net:3000/api/v1/repos/bolandeu/semkit/commits/{commit}/status"
gate_timeout_minutes = 20  # counts from the job start, the runner queue is not counted; the gate takes ~6-9 min

[connector]
webhook_secret = "PLANE_WEBHOOK_SECRET_TOOLS"
kind = "plane"
base_url = "https://homeserver.tailee01ab.ts.net:8443"
workspace = "tools"
project_id = "5530ae6d-0d11-4a5c-8527-652e0bd49efd"
humans = ["r.bolandau@gmail.com"]

[connector.states]
ideas = "Backlog"
queue = "Todo"
in_progress = "In Progress"
in_review = "In Review"
publish = "Publishing"
done = "Done"
cancelled = "Cancelled"

[daemon]
enabled = true

[limits]
max_lines = 4000
max_files = 150
max_prompt_tokens = 60000

[workers.pi-glm]  # the reviewer: kind pi, model from [model_policy.pi-glm]
kind = "pi"
args = []
