[models.bge-m3.files]
"onnx/model.onnx" = "ac1c15f94fc871893dcce3ab5a51fa486ac892b0d5c1f55223d62ef45fc8d5d6"
"tokenizer.json" = "3e657ddc9bb3a7425f881e701aedfee5911936be4d6f4efde8a2bc557eb34844"

[models.potion]
